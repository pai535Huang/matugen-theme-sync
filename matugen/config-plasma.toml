[config]

[templates.gtk3_import]
input_path = "~/.config/matugen/templates/gtk-import.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.gtk4_import]
input_path = "~/.config/matugen/templates/gtk-import.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.gnome_shell]
input_path = "~/.config/matugen/templates/gnome-shell.css"
output_path = "~/.themes/Matugen/gnome-shell/gnome-shell.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/kitty-colors.conf"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim-colors.vim"
output_path = "~/.config/nvim/colors/matugen.vim"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.ini"
output_path = "~/.config/cava/colors.ini"

[templates.tmux]
input_path = "~/.config/matugen/templates/tmux-colors.conf"
output_path = "~/.config/tmux/colors.conf"

[templates.zellij]
input_path = "~/.config/matugen/templates/zellij-theme.kdl.tera"
output_path = "~/.config/zellij/themes/matugen.kdl"

[templates.starship]
input_path = "~/.config/matugen/templates/starship-colors.toml"
output_path = "~/.config/matugen/themes/starship-colors.toml"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi-theme.toml"
output_path = "~/.config/yazi/colors.toml"

[templates.obsidian]
input_path = "~/.config/matugen/templates/obsidian.css"
output_path = "~/.config/matugen/themes/obsidian.css"

[templates.firefox]
input_path = "~/.config/matugen/templates/firefox-colors.css"
output_path = "~/.config/matugen/themes/firefox-colors.css"

[templates.qt5ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update >/dev/null 2>&1 || true"

[templates.kde_color_scheme_light]
input_path = "~/.config/matugen/templates/kde-colors-light.colors"
output_path = "~/.local/share/color-schemes/MatugenLight.colors"

[templates.kde_color_scheme_dark]
input_path = "~/.config/matugen/templates/kde-colors-dark.colors"
output_path = "~/.local/share/color-schemes/MatugenDark.colors"
